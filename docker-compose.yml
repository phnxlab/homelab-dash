services:
  web:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8081:8081"
    volumes:
      - homelab-data:/app/data
      - homelab-static:/app/staticfiles
    healthcheck:
      test: ["CMD", "python", "manage.py", "check"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  homelab-data:
  homelab-static:
